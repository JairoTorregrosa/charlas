# La bitácora: una entrada por charla, en cualquier orden (el índice las ordena por fecha).
# De aquí salen el índice del README, la ficha que abre cada kit y sus imágenes.
# Después de tocar este archivo o un deck:  uv run scripts/catalogo.py
#
# fecha        "AAAA-MM-DD", o "AAAA-MM" cuando solo consta el mes.
# evento_url   la página del evento: Luma, el sitio oficial o una nota de prensa.
# portada      la página del deck que sirve de carátula (no siempre es la primera).
# demo, skills listas de { nombre, ruta } para lo que vive en el kit o { nombre, url } para lo
#              que vive fuera. Pueden ir vacías, pero no las dos a la vez.
# usar         lo que se escribe para tener la skill; una lista cuando son varios comandos.

repo = "JairoTorregrosa/charlas"
rama = "main"

[ciudades]
"Bogotá" = { pais = "Colombia", lat = 4.7110, lon = -74.0721 }
"Yopal" = { pais = "Colombia", lat = 5.3378, lon = -72.3959 }
"Santa Marta" = { pais = "Colombia", lat = 11.2408, lon = -74.1990 }
"Montrose, Colorado" = { pais = "Estados Unidos", lat = 38.4783, lon = -107.8762 }

