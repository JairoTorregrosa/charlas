# Managed by gh-guard (github.com/JairoTorregrosa/gh-guard). Edits here are
# overwritten by the reconciler: change the template in gh-guard instead.
#
# Required check `codex-review`: turns Codex Cloud's PR review (ChatGPT plan, set
# up at chatgpt.com/codex/cloud/settings) into a merge gate. Codex publishes no
# check run, only a summary comment with a hidden `codex-review-state:v1` JSON
# marker. This job waits until that marker says Codex finished reviewing the
# PR's head commit, and passes only if it has no unresolved findings.
# Codex ignores "@codex review" from bots and doesn't review later pushes by itself, so
# `codex-nudge` (gh-guard, every 5 min, as the repo owner) requests reviews for unreviewed
# heads and re-runs this job once Codex has reviewed the head.
# Codex review rules for a repo go in AGENTS.md under `## Code Review Rules`.
# False positive? Add the `ai-review-override` label to the PR.
name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # Codex submits a PR review when it has findings; re-evaluate right away.
  # (pull_request_review runs count toward required checks; issue_comment runs don't.)
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read

# No `concurrency`: cancelling is what broke the gate. A push and a Codex review arrive
# together, one run cancels the other, and the cancelled check run (same name, same head)
# blocks the merge although another run passed. Every run therefore finishes with a
# verdict instead. Runs for the same head read the same marker, so they agree, and a run
# whose head is no longer the PR's head stops at once (see "superseded" below).

jobs:
  codex-review:
    # Never skip on review events: a skipped run would count as a pass.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Codex verdict on head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'ai-review-override') }}
          CODEX_BOT: chatgpt-codex-connector[bot]
          WAIT_MIN: "20"
        run: |
          set -euo pipefail
          if [ "$OVERRIDE" = true ]; then
            echo "::warning::ai-review-override label set: Codex review not enforced"; exit 0
          fi
          state() { # latest codex-review-state JSON from Codex's summary comment, or empty
            gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq ".[] | select(.user.login==\"$CODEX_BOT\") | select(.body|contains(\"codex-review-state:v1\")) | .body | @base64" \
              | tail -n1 | base64 -d | sed -n 's/.*<!-- codex-review-state:v1 \(.*\) -->.*/\1/p'
          }
          start=$(date +%s)
          while :; do
            cur=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            if [ "$cur" != "$HEAD" ]; then
              echo "::notice::superseded: the PR head is now $cur, not $HEAD; that head's run decides"; exit 0
            fi
            s=$(state || true)
            if [ -n "$s" ]; then
              sha=$(jq -r '.code_review.commit_sha // ""' <<<"$s")
              status=$(jq -r '.code_review.status // ""' <<<"$s")
              unresolved=$(jq -r '.code_review.has_unresolved_findings' <<<"$s")
              echo "codex state: commit=$sha status=$status unresolved=$unresolved (head=$HEAD)"
              if [ "$sha" = "$HEAD" ] && [ "$status" = completed ]; then
                if [ "$unresolved" = false ]; then echo "Codex reviewed $HEAD: no unresolved findings"; exit 0; fi
                echo "::error::Codex has unresolved findings on $HEAD. Next: read them (gh api repos/$REPO/pulls/$PR/comments), fix and push, or reply and resolve each thread; codex-nudge re-runs this job once Codex reports no unresolved findings. False positive: add the ai-review-override label. Full status: merge-ready $REPO $PR"
                exit 1
              fi
            fi
            now=$(date +%s)
            if [ $((now - start)) -ge $((WAIT_MIN * 60)) ]; then
              echo "::error::Codex did not review $HEAD within ${WAIT_MIN} min. codex-nudge requests a review and re-runs this job; or comment '@codex review' yourself and re-run (is Codex code review enabled for this repo at chatgpt.com/codex/cloud/settings?)."
              exit 1
            fi
            sleep 20
          done
