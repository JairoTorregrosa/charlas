# Managed by gh-guard (github.com/JairoTorregrosa/gh-guard). Edits here are
# overwritten by the reconciler: change the template in gh-guard instead.
#
# Required check `codex-review`: turns Codex Cloud's PR review (ChatGPT plan, set
# up at chatgpt.com/codex/cloud/settings) into a merge gate. Codex publishes no
# check run, only a summary comment with a hidden `codex-review-state:v1` JSON
# marker. This job waits until that marker says Codex finished reviewing the
# PR's head commit, and passes only if it has no unresolved findings.
# Codex review rules for a repo go in AGENTS.md under `## Code Review Rules`.
# False positive? Add the `ai-review-override` label to the PR.
name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # Codex submits a PR review when it has findings; re-evaluate right away.
  # (pull_request_review runs count toward required checks; issue_comment runs don't.)
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    # Never skip on review events: a skipped run would count as a pass.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Codex verdict on head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'ai-review-override') }}
          CODEX_BOT: chatgpt-codex-connector[bot]
          WAIT_MIN: "20"
          ASK_AFTER_SEC: "180"
        run: |
          set -euo pipefail
          if [ "$OVERRIDE" = true ]; then
            echo "::warning::ai-review-override label set: Codex review not enforced"; exit 0
          fi
          state() { # latest codex-review-state JSON from Codex's summary comment, or empty
            gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq ".[] | select(.user.login==\"$CODEX_BOT\") | select(.body|contains(\"codex-review-state:v1\")) | .body | @base64" \
              | tail -n1 | base64 -d | sed -n 's/.*<!-- codex-review-state:v1 \(.*\) -->.*/\1/p'
          }
          start=$(date +%s); asked=0
          while :; do
            s=$(state || true)
            if [ -n "$s" ]; then
              sha=$(jq -r '.code_review.commit_sha // ""' <<<"$s")
              status=$(jq -r '.code_review.status // ""' <<<"$s")
              unresolved=$(jq -r '.code_review.has_unresolved_findings' <<<"$s")
              echo "codex state: commit=$sha status=$status unresolved=$unresolved (head=$HEAD)"
              if [ "$sha" = "$HEAD" ] && [ "$status" = completed ]; then
                if [ "$unresolved" = false ]; then echo "Codex reviewed $HEAD: no unresolved findings"; exit 0; fi
                echo "::error::Codex has unresolved findings on $HEAD. Fix and push, resolve the threads and re-run this job, or add the ai-review-override label."
                exit 1
              fi
            fi
            now=$(date +%s)
            # Codex auto-reviews on open/ready; ask explicitly for later pushes. Any run may ask
            # (a cancelled run can't), but only once per head commit: the request carries a
            # hidden marker with the SHA it was made for.
            if [ "$asked" = 0 ] && [ $((now - start)) -ge "$ASK_AFTER_SEC" ]; then
              marker="<!-- gh-guard-codex-request:$HEAD -->"
              prior=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
                --jq "[.[] | select(.body | contains(\"$marker\"))] | length" | jq -s add)
              if [ "${prior:-0}" = 0 ]; then
                echo "No Codex review of $HEAD yet, requesting one"
                # REST issue comment: needs only issues:write (gh pr comment needs pull-requests:write)
                gh api "repos/$REPO/issues/$PR/comments" -f body="@codex review
          $marker" >/dev/null
              fi
              asked=1
            fi
            if [ $((now - start)) -ge $((WAIT_MIN * 60)) ]; then
              echo "::error::Codex did not review $HEAD within ${WAIT_MIN} min. Comment '@codex review' and re-run this job (is Codex code review enabled for this repo at chatgpt.com/codex/cloud/settings?)."
              exit 1
            fi
            sleep 20
          done
