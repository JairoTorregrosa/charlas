# El índice, la ficha de cada kit y sus imágenes salen de charlas.toml.
# Este check falla cuando alguien añade o cambia una charla y no corre el generador.
name: Catálogo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Cada `uses:` va fijado a un commit completo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --locked scripts/catalogo.py --check
