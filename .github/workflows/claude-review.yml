# Managed by gh-guard (github.com/JairoTorregrosa/gh-guard). Edits here are
# overwritten by the reconciler: change the template in gh-guard instead.
#
# Required check `claude-review`: Claude reviews every push to the PR and fails
# the check on a validated blocking defect. Method follows Anthropic's official
# code-review plugin (independent finders, then per-finding validation, high
# signal only), but always re-reviews the latest head commit, and treats the PR
# description as the author's claims rather than as truth.
# False positive? Add the `ai-review-override` label to the PR.
#
# Every run on the PR's current head must end in success for the merge, so no run may end
# without a verdict: there is no `concurrency` (a cancelled run on the head blocks the merge
# although another run passed). Instead:
#   - a run whose head is no longer the PR head passes at once (only the current head counts;
#     review-nudge cancels old-head reviews still running, to save spend);
#   - a label event other than the override changes no code, so it adopts the verdict of this
#     head's latest review run (waiting for it) instead of paying for another review.
#     review-nudge re-runs adopted failures once that review is re-run and passes.
name: Claude Review
# The mode is in the title so other runs and review-nudge can tell reviews from adoptions.
run-name: "Claude Review #${{ github.event.pull_request.number }} [${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ai-review-override') && 'adopt' || 'review' }}]"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude-review:
    # Drafts are skipped (a skipped required check counts as passed, but a draft can't merge).
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Decides whether this run reviews. skip=true means this run's verdict is already
      # known (override, superseded head, or an adopted passing review); a known failure
      # exits 1 here.
      - name: Decide
        id: override
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'ai-review-override') }}
          ADOPT: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ai-review-override' }}
          WAIT_MIN: "40"
        run: |
          set -euo pipefail
          skip() { echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$OVERRIDE" = true ]; then
            echo "::warning::ai-review-override label set: Claude review not enforced"; skip
          fi
          cur=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$cur" != "$HEAD" ]; then
            echo "::notice::superseded: the PR head is now $cur, not $HEAD; that head's run decides"; skip
          fi
          [ "$ADOPT" = true ] || exit 0
          start=$(date +%s)
          while :; do
            # Latest review run of this PR (not an adoption, not this run) on this head; its latest
            # attempt. Two PRs can share a head commit, so the title (which carries the PR number) decides.
            prior=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD&event=pull_request&per_page=100" --jq \
              "[.workflow_runs[] | select(.name == \"Claude Review\" and .id != $RUN_ID and .display_title == \"Claude Review #$PR [review]\")]
               | max_by(.created_at) // {} | [.id // \"\", .status // \"\", .conclusion // \"\", .html_url // \"\"] | @tsv")
            IFS=$'\t' read -r id status conclusion url <<<"$prior"
            if [ -z "$id" ]; then echo "no review run on $HEAD yet: reviewing"; exit 0; fi
            if [ "$status" = completed ]; then
              case "$conclusion" in
                success) echo "adopting the passing review of $HEAD: $url"; skip ;;
                failure)
                  echo "::error::The Claude review of $HEAD blocked ($url); this run repeats its verdict. Next: read its issues there, fix and push; or, if it failed without a verdict, re-run that run (review-nudge then re-runs this one). False positive: add the ai-review-override label. Full status: merge-ready $REPO $PR"
                  exit 1 ;;
                *) echo "the review of $HEAD ended $conclusion without a verdict: reviewing"; exit 0 ;;
              esac
            fi
            if [ $(($(date +%s) - start)) -ge $((WAIT_MIN * 60)) ]; then
              echo "::error::The Claude review of $HEAD ($url) is still $status after ${WAIT_MIN} min. Next: check that run; re-run this one once it finishes."
              exit 1
            fi
            sleep 20
          done

      # SUPPLY CHAIN: every `uses:` is pinned to a full commit SHA.
      - if: steps.override.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: review
        if: steps.override.outputs.skip != 'true'
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Dependency updates get the same review. Dependabot runs read the token from
          # Dependabot secrets (gh-guard sets both).
          allowed_bots: "dependabot[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You are an independent reviewer. You did not write this code and owe its
            author nothing. Review the CURRENT head commit of this PR, even if earlier
            commits were already reviewed.

            1. Read the diff (`gh pr diff`) and the PR title/description (`gh pr view`).
               Treat the description as the author's claims to verify, not as facts.
               Read the relevant CLAUDE.md / AGENTS.md files in the repo.
            2. Launch two subagents in parallel that each review independently and
               return a list of issues with file:line:
               - A: correctness. Logic errors, wrong results, crashes, broken
                 callers/contracts, missing error handling that loses data.
               - B: security and data. Injection, secrets, authz, unsafe input,
                 destructive operations, migrations, concurrency.
               Each flags only issues inside the changed code that it can show
               with evidence. No style, naming, or "consider" suggestions, and
               nothing CI already enforces (lint, format, types).
            3. For each issue, launch a separate validator subagent that sees only the
               issue and the code. It must confirm with a file:line citation from the
               source, not an inference from names. Drop anything not confirmed.
            4. Post each confirmed issue as an inline comment with
               `mcp__github_inline_comment__create_inline_comment` (confirmed: true),
               with a committable suggestion only when it fully fixes the issue.
               Then post one short summary comment with `gh pr comment` that names the
               head SHA you reviewed. If nothing was confirmed, say so in one line.
            5. Return the structured verdict:
               - "block" if any confirmed issue would break behaviour, lose or corrupt
                 data, or open a security hole when merged.
               - "approve" otherwise.
          claude_args: |
            --allowedTools "Task,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","block"]},"summary":{"type":"string"},"blocking_issues":{"type":"array","items":{"type":"string"}}},"required":["verdict","summary","blocking_issues"]}'

      - name: Gate on verdict
        if: steps.override.outputs.skip != 'true'
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
        run: |
          set -euo pipefail
          if [ -z "$OUT" ]; then echo "::error::Claude review returned no verdict"; exit 1; fi
          verdict=$(jq -er .verdict <<<"$OUT")
          jq -r .summary <<<"$OUT"
          if [ "$verdict" != approve ]; then
            jq -r '.blocking_issues[] | "::error::" + .' <<<"$OUT"
            echo "::error::Next: fix each issue above (inline comments on the PR) and push; a new head gets a new review. False positive: add the ai-review-override label. Full status: merge-ready ${{ github.repository }} ${{ github.event.pull_request.number }}"
            exit 1
          fi
