<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="el mismo loop en tres lugares: tu computador, tu aplicación, la API de Anthropic">
  <defs>
    <marker id="ah-three-places" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D97757"/>
    </marker>
    <!-- minimal loop in local coords (boxes 220x110); used at scale 0.45, strokes compensated so they render at 3 / 4 px -->
    <g id="mini-loop-three-places" font-family='"Anthropic Sans", "Inter", system-ui, sans-serif' font-weight="500" font-size="44" text-anchor="middle" dominant-baseline="central">
      <path d="M712,150 Q850,190 800,343" fill="none" stroke="#D97757" stroke-width="8.9" marker-end="url(#ah-three-places)"/>
      <path d="M690,457 C640,545 548,545 504,457" fill="none" stroke="#D97757" stroke-width="8.9" marker-end="url(#ah-three-places)"/>
      <path d="M400,343 Q350,190 488,150" fill="none" stroke="#D97757" stroke-width="8.9" marker-end="url(#ah-three-places)"/>
      <rect x="490" y="65"  width="220" height="110" rx="12" fill="#FAF9F5" stroke="#141413" stroke-width="6.7"/>
      <rect x="680" y="345" width="220" height="110" rx="12" fill="#FAF9F5" stroke="#141413" stroke-width="6.7"/>
      <rect x="300" y="345" width="220" height="110" rx="12" fill="#FAF9F5" stroke="#141413" stroke-width="6.7"/>
      <text x="600" y="120" fill="#141413">contexto</text>
      <text x="790" y="400" fill="#141413">modelo</text>
      <text x="410" y="400" fill="#141413">tool</text>
    </g>
  </defs>
  <g font-family='"Anthropic Sans", "Inter", system-ui, sans-serif' font-weight="500" text-anchor="middle" dominant-baseline="central">
    <!-- containers -->
    <g fill="none" stroke="#141413" stroke-width="3">
      <rect x="60"  y="120" width="330" height="300" rx="20"/>
      <rect x="435" y="120" width="330" height="300" rx="20"/>
      <rect x="810" y="120" width="330" height="300" rx="20"/>
    </g>
    <!-- the same loop, three times -->
    <use href="#mini-loop-three-places" transform="translate(-45,138) scale(0.45)"/>
    <use href="#mini-loop-three-places" transform="translate(330,138) scale(0.45)"/>
    <use href="#mini-loop-three-places" transform="translate(705,138) scale(0.45)"/>
    <!-- captions -->
    <g font-size="30" fill="#87867F">
      <text x="225" y="482">tu computador</text>
      <text x="600" y="482">tu aplicación</text>
      <text x="975" y="482">la API de Anthropic</text>
    </g>
  </g>
</svg>
