<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="el loop de un agente: contexto, modelo, tool_use, tool, tool_result, y la salida parar hacia respuesta">
  <defs>
    <marker id="ah-loop" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D97757"/>
    </marker>
    <marker id="ah-loop-exit" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#87867F"/>
    </marker>
  </defs>
  <g font-family='"Anthropic Sans", "Inter", system-ui, sans-serif' font-weight="500" text-anchor="middle" dominant-baseline="central">
    <!-- loop arrows (clay) -->
    <path class="loop-arrow" d="M331,150 H489" fill="none" stroke="#D97757" stroke-width="4" marker-end="url(#ah-loop)"/>
    <path class="loop-arrow" d="M600,206 V394" fill="none" stroke="#D97757" stroke-width="4" marker-end="url(#ah-loop)"/>
    <path class="loop-arrow" d="M489,450 H232 A12,12 0 0 1 220,438 V206" fill="none" stroke="#D97757" stroke-width="4" marker-end="url(#ah-loop)"/>
    <!-- exit arrow (gray) -->
    <path class="exit-arrow" d="M711,150 H869" fill="none" stroke="#87867F" stroke-width="4" marker-end="url(#ah-loop-exit)"/>
    <!-- boxes -->
    <rect x="110" y="95"  width="220" height="110" rx="12" fill="none" stroke="#141413" stroke-width="3"/>
    <rect x="490" y="95"  width="220" height="110" rx="12" fill="none" stroke="#141413" stroke-width="3"/>
    <rect x="870" y="95"  width="220" height="110" rx="12" fill="none" stroke="#141413" stroke-width="3"/>
    <rect x="490" y="395" width="220" height="110" rx="12" fill="none" stroke="#141413" stroke-width="3"/>
    <!-- main labels -->
    <text x="220" y="150" font-size="40" fill="#141413">contexto</text>
    <text x="600" y="150" font-size="40" fill="#141413">modelo</text>
    <text x="980" y="150" font-size="40" fill="#141413">respuesta</text>
    <text x="600" y="450" font-size="40" fill="#141413">tool</text>
    <!-- secondary labels -->
    <text x="790" y="120" font-size="30" fill="#87867F">parar</text>
    <text x="618" y="300" font-size="30" fill="#87867F" text-anchor="start">tool_use</text>
    <text x="354" y="487" font-size="30" fill="#87867F">tool_result</text>
  </g>
</svg>
