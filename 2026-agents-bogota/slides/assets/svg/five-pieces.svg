<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="cinco piezas: modelo, tools, contexto, loop, parada; la parada vuelve al modelo">
  <defs>
    <marker id="ah-five-pieces" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D97757"/>
    </marker>
  </defs>
  <g font-family='"Anthropic Sans", "Inter", system-ui, sans-serif' font-weight="500" text-anchor="middle" dominant-baseline="central">
    <!-- return arc: parada -> modelo (one arrowhead, into modelo) -->
    <path d="M1042,309 C1042,130 158,130 158,309" fill="none" stroke="#D97757" stroke-width="3" marker-end="url(#ah-five-pieces)"/>
    <!-- boxes (220x110 scaled 0.8 = 176x88 so five fit with margins) -->
    <rect x="70"  y="310" width="176" height="88" rx="12" fill="#FAF9F5" stroke="#141413" stroke-width="3"/>
    <rect x="291" y="310" width="176" height="88" rx="12" fill="#FAF9F5" stroke="#141413" stroke-width="3"/>
    <rect x="512" y="310" width="176" height="88" rx="12" fill="#FAF9F5" stroke="#141413" stroke-width="3"/>
    <rect x="733" y="310" width="176" height="88" rx="12" fill="#FAF9F5" stroke="#141413" stroke-width="3"/>
    <rect x="954" y="310" width="176" height="88" rx="12" fill="#FAF9F5" stroke="#141413" stroke-width="3"/>
    <!-- labels -->
    <text x="158"  y="354" font-size="32" fill="#141413">modelo</text>
    <text x="379"  y="354" font-size="32" fill="#141413">tools</text>
    <text x="600"  y="354" font-size="32" fill="#141413">contexto</text>
    <text x="821"  y="354" font-size="32" fill="#141413">loop</text>
    <text x="1042" y="354" font-size="32" fill="#141413">parada</text>
  </g>
</svg>
