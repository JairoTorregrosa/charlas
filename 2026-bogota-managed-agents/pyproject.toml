[project]
name = "taller-managed-agents"
version = "0.1.0"
description = "Workshop de Claude Managed Agents · Claude Community Bogotá · 24-oct-2026"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.16.0",
    # Con un brotli viejo, los errores reales de la API quedan escondidos detrás de APIConnectionError.
    "brotli>=1.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
